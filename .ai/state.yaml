runtime:
  mode: minimal_v1
  current_batch:
    phase: runtime_ownership_cleanup
    scope:
      - immutable RuntimeObservation and system event adapter
      - observation-aware PersonalTurnContext with no synthetic user input
      - manager-owned observation admission on the regular session lock
      - Persona-only middleware handling through the unified Output Controller
      - assistant-only conversation persistence with turn-id idempotency
      - proactive capability admission and terminal lifecycle enforcement
      - canonical finalized material rebuilt at the middleware persistence boundary
      - fail turn completion when no physical Interaction output was delivered
      - source-derived flow diagram and explicit transition-risk inventory
    non_goals:
      - heartbeat
      - policy or configuration
      - cron or active_reply migration
      - Router, Planner, or Core execution
    confirmed_gaps:
      - partial physical delivery lacks a structured receipt
      - Prompt still depends on platform, plugin, provider, memory, and Native agent contracts instead of narrow fact ports
      - Native capability snapshots still carry ToolSet runtime objects instead of a backend-neutral capability contract
      - proactive media-only output still uses the raw platform sink because it has no canonical semantic material
      - PersonalTurnContext exists but the main Interaction path still coordinates through 117 literal event-extra keys
    dependency_review:
      core_modules: 474
      runtime_import_sccs: 0
      fixed:
        - Process SubStages now import the pipeline Stage base directly
        - star_manager imports StarMetadata from its defining module instead of relying on package initialization order
        - Prompt-owned instruction resources no longer live under astr_main_agent_resources
        - plugin ProviderRequest generators resume after delegated Core execution
        - session admission and lease acquisition now happen before plugin handlers
        - TurnExecutionScope owns Router, Persona, Context Material, and stream-observation tasks
        - immediate Persona, Core final, and finalized proactive plugin output share one atomic turn-lock reservation
        - proactive text output and same-session tool progress use Personal Runtime and Output Controller
        - assistant-only history projects into Prompt and Memory without a synthetic user message
        - Provider output-contract tool adapters no longer import Prompt
