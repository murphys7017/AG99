task:
  class: feature
  risk: medium
  phase: identity_bindings_config_validated
  scope: memory standard/advanced provider split, simplified Web config, and Web-editable identity mappings
context:
  confidence: high
  assumptions:
    - Short-term memory analyzers should use the standard memory provider.
    - Consolidation and long-term memory analyzers should use the advanced memory provider.
    - Advanced memory provider should fall back to standard provider when left empty.
    - Existing per-analyzer provider_id values should remain as legacy fallbacks when standard/advanced providers are empty.
    - memory.identity.bindings should take precedence over the legacy identity_mappings.yaml file when present in Web config.
  unresolved_questions: []
architecture:
  stability: stable
  boundary_changes:
    - Memory analysis now supports standard_provider_id and advanced_provider_id.
    - Analyzer provider resolution prefers standard/advanced providers and falls back to legacy per-analyzer provider_id values.
    - Memory Web config now exposes a simplified basic/models/advanced layout.
    - Memory identity mappings can be edited through memory.identity.bindings while legacy YAML remains as a fallback.
verification:
  checks_run:
