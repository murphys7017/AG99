    - .venv\Scripts\python -m pytest tests/unit/test_memory_analyzer.py tests/unit/test_memory_config.py tests/unit/test_memory_store.py tests/unit/test_memory_identity.py tests/unit/test_memory_runtime.py tests/unit/test_config.py -q
    - .venv\Scripts\python -m json.tool dashboard/src/i18n/locales/zh-CN/features/config-metadata.json
    - .venv\Scripts\python -m json.tool dashboard/src/i18n/locales/en-US/features/config-metadata.json
