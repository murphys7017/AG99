    arbitration_review:
      - Plugin takeover is intentionally best-effort. HANDLED, STOPPED, or DELEGATED suppress only pending Persona work; an already committed or emitted Personal reply is never recalled, so the review claim that takeover is unreachable is overstated
      - Core start currently waits for both Router completion and plugin_resolved_at. The resulting delay up to plugin_parallel_window_seconds is a frozen Phase 5B tradeoff and is diagnosed separately; decoupling takeover authority from Core start permission would be a new architecture decision
      - DELEGATED intentionally preserves the official async-generator ProviderRequest rendezvous and is synchronous after delegation. Truly asynchronous agent-style plugin work requires a separate public API rather than changing the compatibility contract
      - Plugin Job failures before takeover are fail-open. Delegated ordinary Core Exceptions are normally converted into Core error output, while cancellation or unusual BaseException can still escape the rendezvous; this is a narrow recovery-boundary risk rather than a confirmed broad plugin-output-loss defect
      - Group continuation ownership is Manager-scoped by config/audience/privacy, with frozen per-turn eligibility and turn-id guarded completion; Persona Runtime instances no longer independently create or restore group owners
      - Starting Personal and Router for turns later handled by a terminal plugin intentionally spends speculative work to preserve same-t0 latency. Preclassifying terminal handlers would require new metadata or filter inference and conflicts with the decision that official handlers run and decide internally
      - The old and coordinated orchestration paths remain while the global switch is default-disabled, and duplicated terminal branches in resolve_control are maintenance debt to consolidate only after production validation
      - event.stop_event remains behaviorally meaningful after coordinated plugin delivery because it prevents downstream Pipeline and ordinary ResultDecorate or Respond processing; it is not only a diagnostic marker
