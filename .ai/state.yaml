task:
  class: bugfix
  risk: high
  phase: parallel_plugin_runtime_production_validation
  scope: Complete the default-disabled Personal, Router, and Official Plugin three-line production path without letting Plugin Handler latency block the first Personal reply or detached Plugin work mutate the original turn.
context:
  confidence: high
  assumptions:
    - Personal Runtime currently prioritizes proactive expression; Policy actions are limited to ignore, observe, express, and defer until a separately reviewed background-execution permission model exists.
    - Deferred, cooldown-held, and quiet-hours-held Observation batches must retain their facts and be re-evaluated by one lifecycle-owned wake scheduler without synthetic user messages or per-runtime polling loops.
    - Runtime diagnostics are read-only, exclude raw Observation payloads and reply material, and report only operational state needed to validate proactive behavior.
    - PersonalState keeps process-local conversational and diagnostic fields while a narrow repository persists only last expression, cooldown, mute, and daily usage control fields by full PersonalRuntimeKey.
    - Completion Feedback is formed once at turn lease release; delivery success requires a visible utterance delivery receipt and is not inferred from send intent or final-output status alone.
    - Policy express creates an internal ActionIntent with a reliable action_id; only its confirmed visible delivery can write proactive daily usage, while every confirmed visible reply starts the shared autonomous-expression cooldown.
    - Policy may only evaluate a batch-owned, unsettled material revision. Normal user turns and Heartbeat do not create proactive Policy material; Heartbeat ignores an empty Inbox and only waits for a retained held batch. Non-coalesced facts and changed coalesced Sensor payloads advance revision, while reject, ignore, observe, fail-closed, discarded, and express-before-delivery outcomes settle it. Hold and defer retain it, so later facts are not consumed and failed sends still do not write cooldown or quota.
    - Only Policy-approved PersonalActionIntent expression is compared with the previous delivered visible reply. Explicit Context.send_message, Cron, and plugin proactive output retain exact-send compatibility behavior.
    - Autonomous expression deduplication uses an irreversible normalized fingerprint from physical delivery feedback persisted by the Personal Runtime control-state repository; Persona Conversation history remains an additional semantic source, while raw reply text is not added to PersonalState or diagnostics.
    - A duplicate autonomous expression is suppressed before effects, TTS, platform delivery, Conversation persistence, cooldown, or proactive quota accounting.
    - Ordinary addressed user messages and bounded group candidates use the same concurrent Personal and Router path. Personal owns immediate visible delivery and does not wait for Router or Planner; Personal Policy applies only to background and ambient RuntimeObservation batches.
    - Router mode, Personal reply status, and final turn outcome are independent facts. Router silent may suppress only pending Personal work; committed or emitted output remains replied, and Core Planner never owns Personal reply admission.
    - Canonical Conversation history supplies semantic context but does not grant wake permission by itself. Only the user who explicitly triggered the Bot through a wake command, Bot mention, or Bot reply may own a group continuation. Handler-only turns without an explicit Bot trigger and messages aimed at other members neither establish nor clear that owner. An active same-owner message is absorbed only when a compatible Runner exists and no Handler takeover candidate is present; otherwise it safely becomes a queued direct continuation. After a delivered visible reply, the configured direct window defaults to 10 seconds and disallows Router silent; the remainder of the bounded continuation window remains same-owner-only and enables Router silent.
    - RuntimeObservationEvent and submit_runtime_observation_event remain post-decision proactive-output adapters and are not the generic Observation Inbox API.
    - PersonalSessionRuntime idle deletion must become bounded TTL/LRU retention before it can own cross-turn state; initial planning bounds are 24 hours and 1024 idle runtimes.
    - Restart-safe state plus mute, quiet-hours, cooldown-duration, and output-budget configuration are present; defer writes a no-action deadline, every delivered visible reply writes reply cooldown, and only delivered ActionIntent output writes proactive usage.
    - Personal Runtime control-state persistence is serialized per Runtime so concurrent completion feedback and Policy usage updates cannot overwrite each other; repository restore failure degrades to process-local state, while final-save failure is diagnosed without aborting Core shutdown.
    - PersonalHeartbeatSource is lifecycle-owned and applies one independent due time per configured Runtime observation target. An empty target list falls back to the legacy default proactive-message target; Heartbeat never creates an event, acquires a turn lease, or invokes Persona, Core, or Output. It ignores an empty Inbox and may request reevaluation only for retained material that has no later lifecycle-owned wake deadline.
    - The Interaction master switch is also the deterministic Observation Gate feature switch. Equal quiet-hours bounds mean an all-day quiet window and reject rather than retain batches because no future wake boundary exists.
    - Plugin PromptExtension targets are restricted to persona and core. Router and Core Planner never mount plugin extensions, plugin capability directories, plugin tools, or plugin LLM lifecycle hooks; only explicitly trusted AstrBot core collectors may provide structured control-plane facts such as recent group context.
    - Official async-generator plugin handlers retain yield ProviderRequest delegation through call_handler and ProcessStage; call_event_hook is a separate coroutine-only LLM lifecycle interface.
    - Context resolves the global Runtime observation target registry across loaded configuration profiles, retaining only targets whose UMO resolves back to an effective profile that declares them. ConversationActivitySource is default-disabled and limited to non-self, non-live, non-addressed text in one of those group targets; the event-matched configuration controls its feature flag and Runtime/Policy settings. Waking only preserves an eligible candidate, while the official whitelist and session-status stages retain their authority before the tap submits a structural fact and stops the original event before rate limiting, plugins, Router, or Core.
    - Plugin Runtime Sensors register stable plugin_id/source_id ownership in Context and receive only a restricted submit handle; Context resolves the target, Lifecycle dispatches to existing PersonalRuntimeManager.submit_observation, and plugin unload removes registrations so stale handles cannot submit.
    - Plugin Sensor payloads are immutable structured facts with a finite expiry. They reject known message/reply/prompt fields and cannot supply events, ProviderRequest, ToolSet, platform connections, or visible reply material.
    - Explicit persona-mode plugin streams buffer semantic text and run through one final Persona output; direct-mode plugin streams retain real-time compatibility delivery.
    - PostprocessManager owns all background after-message and after-turn tasks; it rejects new tasks during shutdown and is explicitly reopened by Core lifecycle startup.
    - Core shutdown settles Personal Runtime and PostprocessManager before plugin, Provider, knowledge-base, memory, platform, and database teardown.
    - EventBus isolates configuration lookup and task-scheduling failures to the affected event, logs them, and continues consuming later events.
    - CoreExecutionSpec owns deep-copied ContextPack slots and metadata, TaskSpec, execution history, and serializable capability descriptions; the Native ToolSet remains the explicit live execution handle until the future capability binding boundary.
    - InteractionTurnState owns the canonical Interaction base ContextPack plus turn-local target enrichment packs; the unused _interaction_prompt_context_pack extra mirror is removed.
    - InteractionTurnState owns the canonical Core-delegation state for ordinary forwarded turns.
    - Prompt branches retain RenderResult locally, and InteractionContextMaterial retains its snapshot in Turn State; unused event-extra render and snapshot mirrors are removed.
    - InteractionStreamState is the sole owner of stream buffers, observations, completion flags, and interjection counts; duplicate Turn State fields and unread event-extra mirrors are removed.
    - InteractionTurnState is the sole owner of persona, lifecycle, completion, failure, finalization, and output-arbitration state; private event-extra mirrors are removed.
    - A generic submit_observation boundary writes immutable facts into a per-runtime bounded inbox without EventBus insertion, synthetic user messages, proactive-message capability requirements, or immediate turn-lease acquisition.
    - Personal Policy gets a dedicated read-only Prompt target and continues to use the canonical Collectors -> ContextPack -> projection -> Render Profile -> Renderer pipeline.
    - The Personal Policy Prompt collection adapter is not a send-capable RuntimeObservationEvent and never enters EventBus or Conversation history.
    - The official EventBus and Pipeline are the only production inbound path; InteractionMiddleware.handle_inbound, its spawn path, core_queue dependency, and enqueue_core branches have been removed.
    - RuntimeObservation is immutable structured system input and is never projected as a user message.
    - Generic observation intake shares the same PersonalSessionRuntime identity as platform turns but does not acquire the turn lock and bypasses EventBus, Pipeline, Router, Planner, Core, Persona, and Output.
    - Policy-approved autonomous expression requires the Adapter to explicitly declare both proactive-message and Personal Runtime delivery support before target admission or session locking; explicit Context, Cron, and plugin sends retain the proactive-message compatibility boundary, while generic submit_observation accepts unsupported targets because observation is not delivery.
    - Each PersonalSessionRuntime owns at most 64 pending observations and one fixed 1.5-second aggregation task; new observations do not extend the deadline, and explicit coalesce identity is kind + source + coalesce_key.
    - Observation evaluation closes an immutable diagnostic batch and runs a deterministic Gate over batch facts, PersonalState, Runtime busy state, and target capability. It cannot invoke Policy, a provider, Persona, Core, Output, or create RuntimeObservationEvent.
    - Gate hold restores the original batch to the same bounded Inbox. Runtime-busy holds are reevaluated when the active turn settles; quiet-hours and cooldown holds are re-evaluated by the lifecycle-owned Wake Scheduler.
    - Generic intake still accepts targets without proactive-message support; the deterministic Gate rejects those batches before any future Policy or output work.
    - Runtime observation handlers receive both the compatibility event and the canonical PersonalTurnContext; cancellation and failure emit terminal lifecycle stages.
    - RuntimeObservationEvent is only the official platform-send compatibility sink; all visible observation output still passes through InteractionOutputController interception.
    - A RuntimeObservationEvent target with explicit Personal Runtime support preserves Record and Plain components sharing one TTS output-segment identity as one physical chain at the Output Controller delivery boundary. Platform proactive sending remains the established send_by_session contract, while default Record standalone delivery remains unchanged for other paths.
    - Observation conversation persistence is assistant-only and turn-idempotent; it never inserts an empty or synthetic user message.
    - Memory represents an assistant-only turn with an empty user_message payload; nonempty text or media user payloads without canonical identity remain warnings.
    - Phase 0 investigation deferred speculative tests; implementation batches validate their affected production boundary.
    - InteractionMemoryStore and its prompt slot were removed because production had no writer; existing local data files are left untouched as user data, but no runtime path reads them.
    - Local master is also a fork branch and is never treated as the official baseline; official boundary checks use the upstream remote plus current production call relationships.
    - The unused Interaction registry scaffold was removed; active contributor registration remains owned by Context. Provider-owned output-contract tool helpers remain because OpenAI and Anthropic sources import them directly.
    - Independent Input Bus/Input Gateway plans are superseded by the official EventBus/Pipeline plus Personal Runtime Adapter boundary.
    - PersonalRuntimeKey is config_id + persona_id + audience_key + privacy_scope; actor and conversation_id remain turn facts rather than runtime identity.
    - After official filters and preprocess, the adapter reserves, binds, and admits a PendingTurn before Plugin Handler execution. Persona identity is resolved from official conversation, session rule, and config facts before the three-line coordinator starts; a later Handler ProviderRequest cannot rebind the active Personal turn.
    - PendingTurn transitions are reserved -> bound -> queued|active -> settled; reserved turns do not own conversational completion.
    - One runtime key has one conversational turn with user-visible completion ownership by default; new messages are offered as follow-up first and otherwise queued.
    - Phase 1 reuses InteractionTurnState as the only writable turn state and records plugin/Subagent/background task handles without migrating their lifecycle ownership before the later plugin-task phase.
    - Interaction event output and proactive text from Context.send_message go through Personal Runtime and Output Controller; media-only proactive output remains the explicit raw-platform boundary.
    - Native and Third-party execution still diverge before execution, but both now run under Personal Runtime turn admission and serialization.
    - ThirdPartyAgentSubStage preserves a plugin-yielded ProviderRequest and only builds one from the event when no explicit request exists; it still bypasses canonical Prompt and Capability preparation.
    - ProviderRequest remains an official plugin compatibility input and low-level hook projection; it is not the future immutable Execution Preparation contract.
    - Existing Dify, Coze, DashScope, and DeerFlow runners are compatibility targets rather than templates for the future Backend interface.
    - Execution Preparation owns TaskSpec, Context/Prompt projection, normalized current input, CapabilitySnapshot, and runtime identity before backend selection; adapters own protocol projection, remote thread state, streaming, cancellation/close, and error translation.
    - Official OnLLMRequest remains after final low-level request projection and before execution; Agent/LLM/Tool hooks are preserved only where the backend exposes the corresponding lifecycle.
    - Execution Backend decoupling is deliberately last; current work first replaces transitional structures before execution preparation.
    - Compatibility protects official public plugin, Pipeline, platform, configuration, and data boundaries, not internal event method replacement, extra mirrors, parallel Agent SubStages, or private callback wiring.
    - Each migration establishes one new owner and removes the replaced internal write path; long-lived dual main paths are not an accepted compatibility strategy.
    - Personal Runtime is the control layer; InteractionPersonaRuntime is the Personal Expression facade and delegates expression-scoped plugin tool execution to the shared ToolLoopAgentRunner rather than owning a second tool loop.
    - Personal Runtime is a control layer and never a plugin mount target. Plugin placement is defined per contribution rather than by the legacy API that happens to invoke it.
    - Persona-facing prompt/context, relationship, entertainment, effect, and LLM lifecycle contributions default to Personal Expression. Executable FunctionTools independently default to Core; a tool declaration or user plugin_tool_targets override must explicitly opt a tool into Personal Expression.
    - Phase 5B removes Official Pipeline Handler body latency from the Personal/Router startup path. Prompt construction now uses a canonical base-facts single-flight plus one prefetched plugin-enrichment single-flight. Persona consumes enrichment only when already ready, Router and Core Planner use base facts, and Core awaits the same task, so dynamic Prompt Extension and Interaction Prompt Contributor latency no longer blocks the first Personal reply or control-plane decisions.
    - The normal Persona flow resolves only explicitly authorized Persona tools and always enters one shared Agent loop, even when the business-tool inventory is empty. Core-result rewriting and runtime-observation expression still expose no business tools. Final persona_expression remains a terminal structured-response protocol and is never executed as a plugin tool.
    - Persona request hooks receive the branch-local PromptApplyResult while the rendered ProviderRequest is bound, so canonical Prompt extensions are not reinjected by legacy request bridges and the marker cannot leak into a later Core branch.
    - Persona, Native Core, and third-party Agent execution share AgentRequestLifecycle as the production Hook owner; astr_agent_hooks.py remains compatibility-only and is not referenced by the production Main Agent.
    - A Persona fallback retains the same post-Hook ProviderRequest and public Agent context, changes only the Provider binding and executable ToolSet binding, rejects an incompatible strict terminal contract, and never replays Hook or completed business-tool side effects.
    - Core OnLLMRequest mutations are deterministically reauthorized into one effective CapabilitySnapshot that is written back to ProviderRequest, MainAgentBuildResult, CoreExecutionSpec, capability schema, and diagnostics.
    - One TurnDeadlineBudget starts at Personal Runtime reservation and is the sole timeout allocation owner for runtime binding, follow-up admission, session queueing, Router, Planner, Persona, Core, Provider calls and fallback, tool execution, Runtime Observation, and completion feedback.
    - Configured Router, Planner, and Persona limits can only shorten their stage; turn_limited is decided when a stage budget is allocated so scheduler precision cannot misclassify total-deadline expiry.
    - OpenAI-compatible SDK retries are disabled; the adapter retries only after classified state-changing recovery, allows one transient network retry, and never retries a stream after output has started.
    - Required protocol tools are never removed by OpenAI-compatible recovery. An unsupported required tool call fails outward so the existing Provider fallback can preserve the request contract.
    - A follow-up that remains unresolved when its new turn admission expires is withdrawn from the old Agent before timeout delivery, preventing delayed double consumption.
    - Deadline cancellation awaits turn-owned tasks and pending tool-result tasks before releasing the session lock. Failure delivery reuses InteractionOutputController and never starts another model request.
    - PersonaEffect is not an executable Persona Tool. It extends the final persona_expression structured-output contract with validated declarative effect_calls; its protocol-level tool-call encoding exists only to enforce output shape. Effects run after expression through output handling, never enter the Persona ToolSet or tool loop, and are Persona-only.
    - Interaction model IDs are optional per-stage overrides. Empty expression, Router, and Planner IDs resolve to the event's currently selected official chat provider, while explicit IDs retain precedence.
    - Terminal plugin Handlers are Pipeline-level response owners, not Persona mounts. A keyword/command Handler that returns a terminal reply may stop the event and prevent Persona or Core from starting; its output can be delivered directly or explicitly persona-rewritten, but that delivery choice does not transfer reply ownership to Persona. A Handler that yields ProviderRequest retains the existing Core-delegation path.
    - The default-disabled parallel Plugin path starts Personal, Router, and one Runtime-owned Official Plugin Job from the same t0. The first window-valid final resolves HANDLED and closes only the current T1 artifact snapshot; later final artifacts from the same Handler chain wait for T1 settlement and use low-priority T2. STOPPED blocks Personal and Core without freezing an empty artifact snapshot, so final output formed after T1 settlement also uses T2. ProviderRequest after terminal Gate resolution is rejected.
    - Plugin delivery-key records live through one Job's T1 and T2 settlement, then are released by plugin_job_id; shutdown clears any remaining records so the deduplication ledger cannot grow with process lifetime.
    - Legacy LLM lifecycle hooks are target-aware. One Persona run preserves Waiting, LLMRequest, AgentBegin, actual business-tool hooks, LLMResponse, and AgentDone in that order. Request hooks run once before the shared Agent loop, fallback retains the same public Agent context, and no separate internal tool-preflight lifecycle exists. Core-targeted hooks retain their existing Core lifecycle.
    - Official Pipeline handler location, filters, priorities, ProviderRequest yield semantics, and Context.send_message public call shape remain compatible. Persona-facing legacy request hooks receive a branch-local ProviderRequest view, so they may modify Persona material without replacing shared Core event extras or its strict output contract. Mutation snapshots recursively clone plain containers but retain opaque ToolSet, plugin, Provider, Conversation, and other live runtime handles by reference.
    - This preparation phase does not create ExecutionBackend, Capability Gateway, remote protocols, or Subagent Service abstractions.
    - Official plugin Handler location, filters, priorities, ProviderRequest yield semantics, and Context.send_message public call shape remain compatible; proactive text now enters Personal Runtime by design.
    - Interaction pipeline results preserve official response-safety and OnDecoratingResult hooks through one shared PreOutputProcessor without reapplying ordinary TTS/t2i/prefix/segmentation decoration; the former event-extra callback bridge is removed.
    - RespondStage-driven and direct Persona Interaction replies share one TurnDeliveryCoordinator-owned OnAfterMessageSent, visible-completion, postprocess, and deferred-finalization boundary. InteractionOutputController remains a compatibility facade, while direct non-Interaction event.send paths retain their existing semantics.
    - Router remains the existing minimal classifier and never plans tasks or receives tool schemas; silent is exposed for bounded group model-continuation candidates and explicit plugin-submitted group reply candidates. With the Phase 5B switch enabled, Router and Persona start with the Official Plugin Job at the same t0; with it disabled, the legacy safe-comparison path starts them after Handler takeover settles. Silent or Router failure suppresses only a pending Persona and never retracts committed or delivered output. Candidate metadata is a low-level event contract and never mutates explicit wake fields; legacy plugins that do not use the opt-in candidate API preserve existing wake behavior.
    - Core Planner performs one binary execute/not_required validation and produces CoreTaskSpec only for execute.
    - Prompt collectors build one canonical base ContextPack per interaction turn, then one single-flight plugin-enrichment pack for Persona and Core; every model branch renders an isolated target projection from the appropriate layer.
    - Interaction uses an explicit base collector profile before routing; the Core overlay adds only execution-specific collectors and never recollects shared session, memory, or explicit provider context.
    - Persona keeps an independent 50-turn recent-history projection by default. Interaction collects one canonical conversation.history fact set; Router, Planner, Policy, Persona, delegated Core, and legacy Core compatibility rendering apply isolated target budgets without recollecting or mutating canonical history.
    - Router and Core Planner model decisions are never inserted into the canonical ContextPack or supplied to each other.
    - Planner output is internal execution material; every user-visible acknowledgement, result, and failure remains owned by the unified Persona Expression layer.
    - Protocol commands and live audio continue to bypass conversational Router and Core Planner.
    - Planner failures never grant Core execution; an already emitted Persona reply may finalize the turn with the Planner failure retained, while turns without visible Persona output remain fail-fast.
    - The retired decision_provider_id, decision_temperature, and decision_timeout compatibility fields are removed rather than repurposed for Planner.
    - Upstream sync should continue by topic rewrite, not broad merge.
    - Prompt, memory, postprocess, and interaction architecture remain local source of truth.
    - Simple upstream items can be marked absorbed when local behavior is functionally equivalent even if git cherry still shows them as upstream-only.
    - "Bundled WebUI should take precedence over `data/dist` only when the user dist version is older than the current core version and the bundled dist exists."
    - WebUI font stack polish is limited to existing global Sass variables and does not change app routing or component behavior.
    - "Several remaining `git cherry +` commits are functionally present by local rewrites; ledger entries are needed to avoid re-reviewing them as missing."
    - "The current batch keeps provider prompt-renderer boundaries explicit: Xiaomi standard API is OpenAI-compatible, Xiaomi Token Plan is Anthropic-compatible."
    - Xiaomi Token Plan should follow the existing token-plan pattern by injecting Authorization as a default custom header instead of introducing a separate auth path.
    - Dashboard auth migration must change backend and WebUI login protocol together; frontend login now sends plaintext password for PBKDF2/legacy verification.
    - Existing legacy MD5 configs should remain recoverable by logging in with the real plaintext password, but the stored MD5 string itself must not authenticate.
    - "`dashboard.password` is retained as a legacy compatibility hash while `dashboard.pbkdf2_password` is the upgraded storage path."
    - "First-use empty dashboard passwords should be replaced with a generated or `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` password and require setup/change before normal use."
    - Knowledge-base and sandbox upstream positives may remain visible in `git cherry` even when current local code already contains equivalent rewrites.
    - The current pass updates the merge ledger when code is already equivalent; it does not rewrite working implementation unnecessarily.
    - Runtime/media/message-tool upstream positives should be absorbed by confirming existing local behavior and adding focused tests where coverage is missing.
    - User explicitly requested the previously skipped version, CI dependency, README, and deploy-script/docs items; this pass absorbs the low-risk release-maintenance subset without broad docs rewrites.
    - The current pass absorbs the latest small upstream fixes by local rewrite while preserving the fork's customized chat, plugin, and provider request paths.
    - The current pass absorbs 20 v4.25.2 upstream commits (file→mtime 2026-05-30..2026-06-05) via topic rewrite; yakumo's prompt/memory/postprocess/interaction architecture is preserved.
    - Provider stats persistence retries transient SQLite `database is locked` errors with bounded exponential backoff instead of dropping usage records.
    - Empty `modalities=[]` is intentionally treated as text-only in this fork, diverging from upstream's empty-as-unconfigured compatibility patch.
    - Reply components emit a strict OneBot V11 `{"type":"reply","data":{"id":str(id)}}` payload so aiocqhttp stops returning `retcode=100`.
    - Plugin page security headers (X-Frame-Options/frame-ancestors) are relaxed only when `ASTRBOT_LAUNCHER` env is set, leaving standalone deployments' CSP posture unchanged.
    - Follow-up 4/5/6 upstream rewrite absorbs MiniMax Token Plan model discovery/M3 default, Anthropic tool_choice schema conversion, selected platform/plugin/template/provider fixes, and the future-task cron backend/manual-run contract.
    - The current follow-up absorbs upstream version 4.25.2, Markdown-aware KB chunking, LLM compression prompt polish, ChatUI recording staging, FIRST_NOTICE EULA/ru-RU notice, and the existing local CronJobPage frontend wiring for manual run/optional delivery session.
    - Prompt memory injection must resolve identity from the current event; a shared group conversation's latest stored turn is not a valid proxy for the current speaker.
    - Memory technical identifiers remain available in structured storage and provenance. Normal Personal and Router semantic prompts omit them by default, while explicit diagnostics, management, debugging, and exact-reference paths may include them when required.
    - Memory scope reads may include USER, GROUP, and GLOBAL, while ordinary turn contributions default to USER and GROUP only. GLOBAL contribution requires an explicit later policy rather than being inferred from every turn.
    - The scoped Memory schema does not migrate pre-Phase-2 local Memory data. Existing memory.db files must be rebuilt when adopting scope_context, revision, and fingerprint columns.
    - Group-chat prompt records use stable sender IDs when available, while nicknames remain display labels only.
    - Prompt target selection is deterministic code projection over the canonical base facts and, for Persona/Core only, the shared plugin-enrichment pack; the removed LLM/rule Prompt Selector is not part of the current architecture.
    - Router, Core Planner, Persona, and Core target projections define distinct context boundaries over the layered ContextPack pipeline.
    - Persona projection excludes extension.capability even when a plugin targets it to Persona; stable capability contracts remain available to Core targets.
    - Static prompt collectors are cached only within one event/config/ProviderRequest identity and must not be treated as cross-turn global cache.
    - Canonical Dialogue History is owned by Personal Runtime output and stores normalized user input plus final Personal Expression; Core tool calls and results persist in a separate Core Execution Ledger.
    - AssetRef stores content identity when already available, otherwise an explicitly non-resolvable source reference; it never persists temporary paths, URLs, or binary media. A managed Asset Store remains future work.
    - CoreExecutionSpec is the executor-neutral fact contract and contains no rendered prompt or ProviderRequest; NativeExecutionAdapter is the only Native ProviderRequest boundary, and this is not yet a complete Backend/Event abstraction.
    - CoreCapabilitySnapshot no longer models Subagent as a first-class portable capability. Native ContextPack and ToolSet still carry handoff compatibility data until capability binding is separated; future Backends are not required to implement AstrBot Subagent.
    - Official on_llm_request remains a post-render low-level ProviderRequest hook; preserving it does not restore removed legacy/shadow prompt modes or internal duplicate injectors.
    - DeepSeek thinking mode is controlled only by the effective Provider `thinking.type`; both thinking and non-thinking requests preserve caller-supplied `tool_choice` instead of silently changing contract semantics.
    - Persona effect applicability is plugin-owned and evaluated against the current event; Core must not hard-code platform-specific effect names or domains.
    - Slot-level meta.targets is a fail-closed model-visibility contract; malformed declarations are not treated as unrestricted access.
    - TTS state is read-only and text-free; plugins observe requested/generating/succeeded/failed but cannot rewrite synthesis input through the lifecycle hook.
    - Logical output segment IDs and physical visible-message IDs are separate identities; physical splitting never infers logical ownership from send order.
    - The rich non-streaming platform boundary is send_message_with_extras; the replaced send_interaction_message name and dual delivery callbacks are removed rather than retained as compatibility wrappers.
  known_issues:
    - AG99live Remote Operator currently registers the same execution-routing prompt through both a generic Prompt Extension Collector and an Interaction Prompt Contributor. The latter defaults to the Persona target, so the Core-only JSON execution protocol can leak into Personal Expression. Split the contribution into planner/Core capability and Core protocol material; do not register it for Persona.
    - The MiniMax Coding Plan MCP server fails before initialization because its resolved MCP SDK does not provide mcp.server.fastmcp. The MCP connection-test log also prints the configured API key. Pin a compatible server dependency set, rotate the exposed key, and redact environment secrets from MCP diagnostics.
  unresolved_questions:
    - Provider renderer family, output-contract support, and executable tool capability are not yet represented by one validated capability contract.
    - DeepSeek first-turn marker state now reads canonical official conversation history, but its applied flag remains event-scoped rather than conversation-scoped.
    - Context Catalog declares lifecycle and redaction rules that are not consistently enforced at runtime.
architecture:
  stability: review_required
  boundary_changes:
    - TurnDeadlineBudget is the canonical per-turn timing boundary. ProcessStage owns platform-turn enforcement and timeout failure delivery, PersonalRuntime owns binding/queue/lease cleanup, and ToolLoopAgentRunner owns deadline-bound Provider and tool cancellation.
    - Voice Service is the sole owner of TTS request IDs and generation terminal states; ordinary Pipeline and Interaction only project the returned state onto output components.
    - Message components carry non-serialized delivery metadata through the existing message-chain splitter, and every physical send receives one metadata mapping through send_message_with_extras.
    - Interaction Turn State allocates logical output-segment IDs independently from physical visible-message IDs; TTS dual output and segmented delivery preserve the logical ID without a positional ID queue.
    - ProcessStage -> InteractionMiddleware.handle_pipeline_event is now the only production Interaction inbound boundary; Middleware marks Core delegation but never reinserts events into the official queue.
    - Conversational Router decisions currently expose persona/hybrid; live audio and protocol commands use an internal Core bypass instead of impersonating a Router decision.
    - With the Phase 5B switch enabled, ordinary addressed turns and unaddressed group continuation/plugin candidates start Router, Persona Expression, and the Official Plugin Job concurrently under one TurnExecutionScope after Handler discovery and turn admission. The disabled compatibility path still waits for Handler takeover to settle. Router silent and Core-final reservation cancel only an uncommitted speculative Persona and never retract delivered output.
    - Router, Persona, and Planner share one turn-local base Context Material single-flight; Persona non-blockingly inspects and Core awaits one prefetched plugin-enrichment single-flight. Cancelling one waiter does not cancel collection needed by another branch, and one failed Interaction Prompt Contributor is recorded and skipped instead of invalidating the whole enrichment pack.
    - Current interaction Turn State stores a pure InteractionRouteDecision; immediate replies and effect calls travel only with the PersonaExpressionResult that produced them.
    - Core final output is returned to Middleware through core_reply_handler, rendered by the single Persona Runtime, then delivered as an explicit prepared result by Output Controller.
    - InteractionResultView exposes route_decision and phase-local effect_calls; final contributors cannot observe stale immediate effects through route state.
    - InteractionOutputContribution no longer defines motion_hints; concrete motion behavior remains plugin-owned through generic effect_calls, platform_extras, or client_objects.
    - Interaction plugins can register a read-only lifecycle observer; middleware/output runtime publish generic turn stages while thinking/tool-running remain reserved for execution backends.
    - Interaction completion distinguishes active/completed/failed/cancelled, and visible output snapshots retain utterance message identity.
    - Plugin unbind clears prompt/result/stream/lifecycle/effect runtime registrations by module prefix so reload cannot reactivate stale contributors.
    - SQLite async engines now use NullPool and connect-time PRAGMAs in core and knowledge-base DB paths.
    - "`documents.doc_id` now gets a guarded unique index migration when no duplicate legacy IDs exist."
    - Dashboard markdown rendering receives streaming state for smooth incremental output.
    - Plugin list responses now include lightweight `pages` names for direct WebUI entry buttons.
    - QQ Official outgoing messages are split into one-media chunks for both event replies and proactive session sends.
    - Xiaomi OpenAI-compatible and Xiaomi Token Plan Anthropic-compatible LLM providers are now registered and exposed through provider templates/WebUI icons.
    - "CLI initialization can seed PBKDF2 and legacy dashboard password hashes from `ASTRBOT_DASHBOARD_INITIAL_PASSWORD` without overwriting existing configs."
    - "`astrbot password` now writes PBKDF2 plus legacy dashboard password hashes and can optionally update the dashboard username."
    - Dashboard login/setup routes now expose setup status, authenticated setup completion, legacy password hints, and password-upgrade hints.
    - Dashboard account-edit UI now sends plaintext current/new passwords to match the PBKDF2 backend verification path.
    - Knowledge-base sparse retrieval uses FTS5 when available and falls back to BM25; EPUB/RST/ADOC uploads and blank-prompt retrieval skip are present locally.
    - Computer-use sandbox behavior includes CUA native upload/write fallback, CUA idle expiry, CUA idle-timeout config exposure, Shipyard Neo explicit/auto profile handling, and readiness/cleanup guards.
