    - Router contributor views ignore shared Persona context material, Persona contributor caches are isolated by expression phase, and delegated Core retains plugin-supplied contexts while stripping conversation-history prefixes.
    - Router prompts receive attachment counts instead of image/file payloads, while Anthropic Persona contexts convert local image URLs to base64 image blocks.
    - Shared structured-output parsing uses json-repair only after standard JSON parsing fails, and still accepts repaired mappings only.
    - PromptRenderEngine applies target-local PromptRenderProfile policy after projection; PromptTreeBuilder depends on PromptLayoutInterface, while provider renderers only compile the completed semantic tree.
    - Builder-based prompt collection rejects conflicting duplicate slots and supports explicit cross-phase replacement; Interaction cross-phase enrichment now uses PromptContextBuilder(base=...) instead of direct shared-pack mutation.
    - Conversation persistence consumes the prompt pipeline's scaffold-free user message instead of saving internal request_context/user_input markup.
    - Model-visible facts come from ContextPack collection; target system/request prompts, output contracts, input suffixes, and hidden-slot rules come from PromptRenderProfile rather than business-module request assembly.
    - Persona begin dialogs, official conversation history, plugin explicit contexts, and current input have a stable ownership-based message order.
    - The exported apply_interaction_core_task_spec direct-request interface remains available for plugin compatibility, while the canonical Main Agent path uses CoreTaskCollector exclusively.
    - Persona effect registrations may provide an event filter; Persona output contracts include only effects applicable to the current event, while unscoped registry listing remains available for management and diagnostics.
    - All Prompt render paths filter llm_exposure=never; explicit target projections additionally enforce slot-level targets before target-specific allowlists.
    - PromptLayoutInterface exposes one explicit render_group contract; PromptTreeBuilder no longer depends on dynamically named layout methods.
    - Persona Expression is already running before hybrid planning; execute starts Core immediately on both queue and official Pipeline paths without injecting Planner task material into Persona. A Core final result committed first suppresses pending Persona output.
