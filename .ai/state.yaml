        - plugin ProviderRequest generators resume after delegated Core execution
        - DELEGATED T1 failures now detach the Plugin Job and preserve completed artifacts through the existing delayed-delivery ledger without changing the historical Gate result or replaying ProviderRequest
        - detached ProviderRequest closes only its originating Handler invocation while later activated Handlers continue
        - session admission and lease acquisition now happen before plugin handlers
