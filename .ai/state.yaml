task:
  class: maintenance
  risk: medium
  phase: upstream_medium_candidate_rewrite
  scope: upstream sync rewrite for ChatUI command suggestions, update progress tracking, and automated MDI subset generation
context:
  confidence: high
  assumptions:
    - Upstream sync should continue by topic rewrite, not broad merge.
    - Prompt, memory, postprocess, and interaction architecture remain local source of truth.
    - Simple upstream items can be marked absorbed when local behavior is functionally equivalent even if git cherry still shows them as upstream-only.
    - Bundled WebUI should take precedence over `data/dist` only when the user dist version is older than the current core version and the bundled dist exists.
    - WebUI font stack polish is limited to existing global Sass variables and does not change app routing or component behavior.
    - Several remaining `git cherry +` commits are functionally present by local rewrites; ledger entries are needed to avoid re-reviewing them as missing.
    - The current medium batch preserves local ChatUI and header layout customizations instead of replacing components with upstream versions.
    - Dashboard MDI subset assets are generated at dev/build time and are no longer tracked in git.
  unresolved_questions: []
architecture:
  stability: stable
  boundary_changes:
    - `/api/update/progress` exposes transient update progress keyed by `progress_id`.
    - Updater/download helpers accept optional progress callbacks.
    - ChatUI composer loads command suggestions from `/api/commands`.
